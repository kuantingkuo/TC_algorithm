# Fill compiler/module/NetCDF settings from the actual T3 environment.
# Official manual: https://man.twcc.ai/@twnia3/rJM5qk3Aw
runtime:
  env_manager: conda
  env_name: forge
  module_purge: true
  module_use: null
  load_modules: []
  compiler: null
  compiler_flags: null
  nf_config: nf-config
scheduler:
  backend: slurm
  account: null
  partition: null
  time: '08:00:00'
  memory: 16G
  array_limit: 1
